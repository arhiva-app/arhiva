<style>
  :root{
    --bg:#0d0e10; --surface:#17181b; --ink:#ede9e1; --ink-dim:#8b8d92;
    --brass:#c9a355; --brass-soft:#8a7240; --line:#2a2c30;
    /* tokeni za teme; podrazumevane vrednosti = tacno dosadasnje boje (tema Klasicna) */
    --accent:#c9a355; --on-accent:#1a1400;
    --overlay-fade:linear-gradient(to top, rgba(13,14,16,0.92), rgba(13,14,16,0));
    --paper:#f4f1ea; --paper-ink:#232323; --paper-head:#1a1400; --paper-line:#c9c3b4; --paper-tab:#5b5648;
    --font-title:'TR Fraunces',serif;
    --font-ui:'TR Inter',sans-serif;
    --font-num:'TR Plex Mono',monospace;
    --font-name:var(--font-title);
    --name-style:italic;
    --title-color:var(--ink);
    --on-brass:#1a1400;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .photo{
    position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  }
  .overlay{
    position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(18px + env(safe-area-inset-bottom));
    background:var(--overlay-fade);
    text-align:center;
  }
  .cap{font-family:var(--font-name);font-style:var(--name-style);font-size:16px;margin:0 0 6px;color:var(--ink);}
  .hint{font-size:12.5px;color:var(--ink-dim);max-width:340px;margin:0 auto;line-height:1.6;}
  .hint b{color:var(--brass);font-weight:600;}
  a.back{color:var(--brass);font-family:var(--font-name);font-style:var(--name-style);font-size:13.5px;margin-top:10px;
    text-decoration:none;border-bottom:1px solid var(--brass-soft);padding-bottom:2px;display:inline-block;}
  a.back.tiny{position:fixed;bottom:14px;right:16px;font-size:11px;opacity:0.45;margin-top:0;border-bottom:none;}
  .missing{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    font-family:var(--font-name);font-style:var(--name-style);color:var(--ink-dim);font-size:15px;text-align:center;padding:20px;}
  .doc-stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;}
  .doc-icon{width:64px;height:64px;color:var(--brass);}
  .open-btn{
    background:var(--accent);color:var(--on-accent);border:none;
    padding:12px 22px;font-family:var(--font-title);font-weight:600;font-size:14.5px;cursor:pointer;
  }
  .open-btn:active{opacity:0.85;}
  .pdf-canvas{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;display:block;}
  .full-doc-link{position:fixed;bottom:14px;left:16px;font-size:11px;color:var(--ink-dim);opacity:0.6;
    font-family:var(--font-name);font-style:var(--name-style);text-decoration:none;border-bottom:1px solid var(--ink-dim);padding-bottom:2px;}
  .doc-reader{position:fixed;inset:0;overflow:auto;background:var(--paper);color:var(--paper-ink);
    padding:20px 18px calc(70px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
  .doc-reader-inner{max-width:640px;margin:0 auto;font-family:var(--font-ui);font-size:15px;line-height:1.6;}
  .doc-reader-inner h1,.doc-reader-inner h2,.doc-reader-inner h3{font-family:var(--font-title);color:var(--paper-head);}
  .doc-reader-inner table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:13px;}
  .doc-reader-inner td,.doc-reader-inner th{border:1px solid var(--paper-line);padding:6px 8px;text-align:left;}
  .doc-reader-inner img{max-width:100%;height:auto;}
  .doc-reader-bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-top:1px solid var(--line);}
  .doc-reader-bar .cap{font-size:13px;margin:0;color:var(--ink);text-align:left;flex:1;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .doc-reader-bar .open-btn{padding:9px 16px;font-size:13px;white-space:nowrap;}
  .back-inline{color:var(--brass);font-family:var(--font-name);font-style:var(--name-style);font-size:12.5px;
    text-decoration:none;white-space:nowrap;}
  .sheet-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;}
  .sheet-tabs button{flex:none;background:none;border:1px solid var(--paper-line);color:var(--paper-tab);padding:5px 12px;
    font-family:var(--font-ui);font-size:12px;cursor:pointer;border-radius:2px;}
  .page-no{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    padding:4px 12px;border-radius:12px;background:var(--accent);color:var(--on-accent);

<body>
<button type="button" class="sc-info" id="scInfo" hidden aria-label="Kako do ikonice na početnom ekranu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="11" x2="12" y2="17"></line><circle cx="12" cy="7.5" r="0.6" fill="currentColor"></circle></svg></button>
<div class="sc-hint" id="scHint" hidden>
  <button type="button" class="sc-x" id="scHintX" aria-label="Zatvori">&#x2715;</button>
  <div class="sc-tx">Za ikonicu na početnom ekranu: <b>&#x22EE;</b> gore desno &rarr; <b>„Dodaj na početni ekran“</b> ili <b>„Instaliraj i kreiraj prečicu“</b></div>
  <svg class="sc-ar" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="8 7 17 7 17 16"></polyline></svg>
</div>
<div id="content"><p class="missing">Učitavanje...</p></div>

<script>
/* ================= SKLADIŠTE — samo čitanje (Arhiva v159) =================
   JEDINO mesto na ovoj stranici koje zna kako se podaci čuvaju; ostatak zove samo SkladisteCitanje.stavka(id).
   Kasnije (Google Drive) dolazi druga verzija ovog dela sa istom funkcijom. Prati modul Skladiste u Arhivi (Galerija-). */
const SkladisteCitanje = (()=>{
/* Čita stavku prvo iz nove baze (arhivaDB), pa iz stare (galerijaDB, verzija 1 — ne menja se).
   Nova baza se NIKAD ne pravi odavde: ako ne postoji, otvaranje se prekida (verziju i skladišta
   određuje samo Arhiva). Vraća {id, name, type, ext, deletedAt, blob, mime} ili null. */
const NEW_DB = 'arhivaDB';
const IDB_NAME = 'galerijaDB';
const IDB_STORE = 'items';
async function dbListed(name){
  if(!indexedDB.databases) return null;
  try{ return (await indexedDB.databases()).some(d=>d.name === name); }catch(e){ return null; }
}
function reqP(r){
  return new Promise(res=>{ r.onsuccess = ()=>res(r.result || null); r.onerror = ()=>res(null); });
}
function openNoCreate(name){
  return new Promise(res=>{
    try{
      const q = indexedDB.open(name);
      q.onupgradeneeded = ()=>{ try{ q.transaction.abort(); }catch(e){} };
      q.onsuccess = ()=>res(q.result);
      q.onerror = ()=>res(null);
    }catch(e){ res(null); }
  });
}
async function itemFromNewDb(id){
  if(await dbListed(NEW_DB) === false) return undefined;
  const db = await openNoCreate(NEW_DB);
  if(!db) return undefined;
  try{
    if(!db.objectStoreNames.contains('docs') || !db.objectStoreNames.contains('files')) return undefined;
    const d = await reqP(db.transaction('docs', 'readonly').objectStore('docs').get(id));
    if(!d) return undefined;
    if(d.purged) return null;
    /* sve stranice dokumenta, redom (prva je i dalje „blob“) */
    const plist = Array.isArray(d.pages) ? d.pages : [];
    const pages = [];
    for(const p of plist){
      const f = await reqP(db.transaction('files', 'readonly').objectStore('files').get(p.file));
      if(f && f.blob) pages.push({blob:f.blob, mime:p.mime || f.blob.type || ''});
    }
    const p = plist[0] || null;
    return {id:d.id, name:d.name || '', type:d.kind || 'image', ext:d.ext || '', deletedAt:d.deletedAt || null,
      blob:(pages[0] && pages[0].blob) || null, mime:(p && p.mime) || (pages[0] && pages[0].mime) || '', pages};
  }finally{ db.close(); }
}
async function itemFromOldDb(id){
  if(await dbListed(IDB_NAME) === false) return null;
  const old = await new Promise((resolve)=>{
    try{
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:'id'});
      };
      req.onsuccess = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)){ db.close(); resolve(null); return; }
        const getReq = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(id);
        getReq.onsuccess = ()=>{ resolve(getReq.result || null); db.close(); };
        getReq.onerror = ()=>{ resolve(null); db.close(); };
      };
      req.onerror = ()=>resolve(null);
    }catch(e){ resolve(null); }
  });
  if(!old) return null;
  const mm = /^data:([^;,]+)/.exec(old.dataUrl || '');
  let blob = null;
  try{ blob = old.dataUrl ? await (await fetch(old.dataUrl)).blob() : null; }catch(e){ blob = null; }
  return {id:old.id, name:old.name || '', type:old.type || 'image', ext:old.ext || '', deletedAt:old.deletedAt || null,
    blob, mime: mm ? mm[1] : ''};
}
async function idbGetItem(id){
  const n = await itemFromNewDb(id);
  if(n !== undefined) return n;
  return await itemFromOldDb(id);
}
return {stavka: idbGetItem};
})();
/* ================= kraj SKLADIŠTA ================= */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const params = new URLSearchParams(location.search);
const id = params.get('p');
/* v133: uputstvo je zatvoreno; ⓘ gore desno ga otvara, ✕ (ili ponovo ⓘ) ga zatvara */
(function(){
  const h = document.getElementById('scHint'), btn = document.getElementById('scInfo'); if(!h || !btn || !id) return;
  btn.hidden = false;
  const set = (on)=>{ h.hidden = !on; btn.hidden = on; };
  btn.onclick = ()=>set(true);
  document.getElementById('scHintX').onclick = ()=>set(false);
})();
const content = document.getElementById('content');

(async ()=>{
  const item = id ? await SkladisteCitanje.stavka(id) : null;

  if(!item){
    content.innerHTML =
      '<div class="missing"><p style="margin:0;">Stavka nije pronađena u ovom browseru.</p>' +
      '<a class="back" href="/">\u2190 Nazad u Arhivu</a></div>';
    return;
  }
  if(item.deletedAt){
    content.innerHTML =
      '<div class="missing"><p style="margin:0;">Ova slika je u korpi.</p>' +
      '<p style="margin:8px 0 0;opacity:.75;font-size:14px;">Vrati je u Arhivi: Podešavanja \u2192 korpa.</p>' +
      '<a class="back" href="/">\u2190 Nazad u Arhivu</a></div>';
    return;
  }
  if(!item.blob){
    content.innerHTML =
      '<div class="missing"><p style="margin:0;">Fajl nije pronađen.</p>' +
      '<a class="back" href="/">\u2190 Nazad u Arhivu</a></div>';
    return;
  }
  document.title = item.name;

  const mime = item.mime || item.blob.type || '';
  const isPdf = item.type === 'pdf' || mime === 'application/pdf';
  const isImage = !isPdf && (item.type === 'image' || (item.type !== 'doc' && mime.indexOf('image/') === 0));

  const backTiny = '<a class="back tiny" href="/">Arhiva</a>';

  if(isImage){
    const pages = (item.pages && item.pages.length) ? item.pages : [{blob:item.blob}];
    const urls = pages.map(()=>null);
    const urlOf = (i)=>{ if(!urls[i]) urls[i] = URL.createObjectURL(pages[i].blob); return urls[i]; };
    content.innerHTML =
      '<div class="stage"><div class="photo" id="photoEl" oncontextmenu="return false;"></div></div>' +
      (pages.length > 1 ? '<div class="page-no" id="pageNo"></div>' : '') + backTiny;
    const photoEl = document.getElementById('photoEl');
    let cur = 0;
    const show = (i)=>{
      cur = (i + pages.length) % pages.length;
      photoEl.style.backgroundImage = "url('" + urlOf(cur) + "')";
      const no = document.getElementById('pageNo');
      if(no) no.textContent = 'str. ' + (cur + 1) + ' / ' + pages.length;
    };
    show(0);
    if(pages.length > 1){
      /* prevlačenje levo/desno lista stranice */
      let sx = 0, sy = 0;
      photoEl.addEventListener('touchstart', (e)=>{ if(e.touches[0]){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
      photoEl.addEventListener('touchend', (e)=>{
        const t = e.changedTouches[0];
        if(!t) return;
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) show(cur + (dx < 0 ? 1 : -1));
      });
      document.addEventListener('keydown', (e)=>{ if(e.key === 'ArrowRight') show(cur + 1); if(e.key === 'ArrowLeft') show(cur - 1); });
    }
    document.title = item.name;
  }else if(isPdf){
    content.innerHTML = '<div class="stage"><canvas class="pdf-canvas" id="pdfCanvas"></canvas></div>' + backTiny;
    const openFullDoc = async ()=>{
      try{
        const url = URL.createObjectURL(item.blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (item.name || 'dokument') + '.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }catch(e){}
    };
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const bytes = new Uint8Array(await item.blob.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
      const page = await pdf.getPage(1);
      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const baseViewport = page.getViewport({scale: 1});
      const scale = Math.min(
        (window.innerWidth * dpr) / baseViewport.width,
        (window.innerHeight * dpr) / baseViewport.height
      );
      const viewport = page.getViewport({scale});
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      await page.render({canvasContext: ctx, viewport}).promise;
      document.title = item.name;
      if(pdf.numPages > 1){
        const link = document.createElement('a');
        link.className = 'full-doc-link';
        link.textContent = 'Otvori ceo dokument (' + pdf.numPages + ' str.)';
        link.href = '#';
        link.onclick = (e)=>{ e.preventDefault(); openFullDoc(); };
        document.body.appendChild(link);
      }
    }catch(e){
      console.error(e);
      content.innerHTML =
        '<div class="doc-stage">' +
          '<svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
          '<div class="cap">'+escapeHtml(item.name)+' <span style="color:var(--ink-dim);font-family:var(--font-num);font-style:normal;font-size:11px;">(PDF)</span></div>' +
          '<button class="open-btn" id="openDoc">Otvori</button>' +
        '</div>' + backTiny;
      document.getElementById('openDoc').onclick = openFullDoc;
    }
  }else{
    const label = item.ext || 'FAJL';
    const extLower = (item.ext || '').toLowerCase();
    const fileName = (item.name || 'dokument') + (item.ext ? '.'+extLower : '');
    const isDocx = extLower === 'docx';
    const isXlsx = extLower === 'xlsx' || extLower === 'xls';

    const downloadFile = async ()=>{
      try{
        const url = URL.createObjectURL(item.blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }catch(e){}
    };

    const showFallback = (debugMsg)=>{
      content.innerHTML =
        '<div class="doc-stage">' +
          '<svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
          '<div class="cap">'+escapeHtml(item.name)+' <span style="color:var(--ink-dim);font-family:var(--font-num);font-style:normal;font-size:11px;">('+label+')</span></div>' +
          '<button class="open-btn" id="openDoc">Otvori</button>' +
          (debugMsg ? '<p style="font-size:10px;color:var(--ink-dim);max-width:300px;word-break:break-word;">'+escapeHtml(debugMsg)+'</p>' : '') +
        '</div>' + backTiny;
      document.getElementById('openDoc').onclick = downloadFile;
    };

    if(isDocx){
      if(typeof mammoth === 'undefined'){
        showFallback('mammoth.js nije učitan (CDN nedostupan)');
      }else{
      try{
        const result = await mammoth.convertToHtml({arrayBuffer: await item.blob.arrayBuffer()});
        content.innerHTML =
          '<div class="doc-reader"><div class="doc-reader-inner">'+result.value+'</div></div>' +
          '<div class="doc-reader-bar"><a class="back-inline" href="/">\u2190 Arhiva</a><p class="cap">'+escapeHtml(item.name)+'</p><button class="open-btn" id="openDoc">Preuzmi</button></div>';
        document.title = item.name;
        document.getElementById('openDoc').onclick = downloadFile;
      }catch(e){
        console.error(e);
        showFallback('Greška: ' + (e && e.message ? e.message : e));
      }
      }
    }else if(isXlsx){
      if(typeof XLSX === 'undefined'){
        showFallback('xlsx.js nije učitan (CDN nedostupan)');
      }else{
      try{
        const wb = XLSX.read(new Uint8Array(await item.blob.arrayBuffer()), {type:'array'});
        let activeSheet = wb.SheetNames[0];
        const renderSheet = (name)=>{
          const html = XLSX.utils.sheet_to_html(wb.Sheets[name], {editable:false});
          const tabsHtml = wb.SheetNames.length > 1
            ? '<div class="sheet-tabs">' + wb.SheetNames.map(n=>
                '<button data-sheet="'+escapeHtml(n)+'" class="'+(n===name?'active':'')+'">'+escapeHtml(n)+'</button>'
              ).join('') + '</div>'
            : '';
          content.innerHTML =
            '<div class="doc-reader"><div class="doc-reader-inner">'+tabsHtml+html+'</div></div>' +
            '<div class="doc-reader-bar"><a class="back-inline" href="/">\u2190 Arhiva</a><p class="cap">'+escapeHtml(item.name)+'</p><button class="open-btn" id="openDoc">Preuzmi</button></div>';
          document.title = item.name;
          document.getElementById('openDoc').onclick = downloadFile;
          content.querySelectorAll('.sheet-tabs button').forEach(btn=>{
            btn.onclick = ()=>renderSheet(btn.getAttribute('data-sheet'));
          });
        };
        renderSheet(activeSheet);
      }catch(e){
        console.error(e);
        showFallback('Greška: ' + (e && e.message ? e.message : e));
      }
      }
    }else{
      showFallback();
    }
  }
})();
</script>
